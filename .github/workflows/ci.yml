# Continuous integration: runs on every pull request and every branch push.
# It is also reused by the deployment workflow before any deployment.
# Third-party actions are pinned to a commit SHA (supply chain security).
name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  app:
    name: Application tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit and HTTP tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Dockerfile lint and build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: warning

      - name: Build image
        run: docker build --tag cigacount:ci app

      - name: Smoke test the container
        run: |
          docker run --detach --name app --publish 3000:3000 --read-only --cap-drop ALL cigacount:ci
          for _ in $(seq 1 15); do
            if curl --silent --fail http://localhost:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1

  terraform:
    name: Terraform checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive infra

      - name: Validate bootstrap stack
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate main stack
        working-directory: infra
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Run offline tests (mocked AWS provider)
        working-directory: infra
        run: terraform test
